<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>ChatGR Admin — вход</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 4rem auto; padding: 1rem; }
    input, button { width: 100%; padding: 0.6rem; margin: 0.4rem 0; box-sizing: border-box; }
    button { background: #2563eb; color: #fff; border: 0; cursor: pointer; border-radius: 6px; }
    .err { color: #b91c1c; }
  </style>
</head>
<body>
  <h1>ChatGR Admin</h1>
  <p>Введи <code>ADMIN_TOKEN</code> из .env</p>
  {% if request.query_params.get('error') %}
  <p class="err">Неверный токен</p>
  {% endif %}
  <form method="post" action="/login">
    <input type="password" name="token" placeholder="Admin token" required>
    <button type="submit">Войти</button>
  </form>
</body>
</html>
